name: Sync Website to Telegram

on:
  schedule:
    - cron: '0 * * * *' # يتم الفحص تلقائياً رأس كل ساعة مجاناً
  workflow_dispatch: # يتيح لك تشغيل الفحص يدوياً بضغطة زر للتجربة الفورية

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install requests feedparser

    - name: Run Sync Script
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      run: python fetch_and_post.py

    - name: Commit and Push if last_guid changed
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add last_guid.txt
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update last processed guid [skip ci]" && git push)
