name: Sync Website to Telegram

on:
  schedule:
    - cron: '0 * * * *' # يستمر في الفحص كل ساعة لالتقاط الجديد فوراً
  workflow_dispatch: # متاح للتشغيل اليدوي فوراً

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install requests feedparser

    - name: Run Sync Script
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      run: python fetch_and_post.py

    - name: Commit and Push History File
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        if [ -f published_links.txt ]; then
          git add published_links.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update history log and counter [skip ci]" && git push origin HEAD:${{ github.ref_name }})
        fi
